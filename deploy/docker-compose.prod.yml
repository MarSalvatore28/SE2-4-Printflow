# PrintFlow · despliegue de demostración (S4-04). Se usa ENCIMA del docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Qué cambia respecto al entorno local:
#   - Caddy delante de todo: HTTPS con certificado válido (Let's Encrypt) y redirección HTTP → HTTPS.
#   - Ni la base de datos ni la web publican puertos: solo Caddy (80 y 443).
#   - n8n no arranca (en la demo los correos los procesa el simulador).
#   - Respaldo diario de la base, con retención de RETENCION_DIAS días (30 por defecto) en ./backups,
#     y copia en Azure Blob Storage si está AZURE_BLOB_SAS_URL.
#
# Variables nuevas en el .env de producción (ver docs/despliegue.md y el final de .env.example):
#   DOMINIO=printflow-demo.eastus.cloudapp.azure.com   (o localhost para probar en la PC)
#   AZURE_BLOB_SAS_URL=https://CUENTA.blob.core.windows.net/respaldos?sv=...   (opcional: copia fuera de la VM)
#   RETENCION_DIAS=30                                   (opcional: días que se guardan los respaldos)
#   HTTP_PORT=80 / HTTPS_PORT=443                       (opcional: solo para probar en una PC)

services:
  db:
    ports: !reset []

  api:
    environment:
      NODE_ENV: production
      CORS_ORIGINS: https://${DOMINIO:?Falta DOMINIO en el .env}

  web:
    ports: !reset []
    expose:
      - "80"

  n8n:
    profiles: ["n8n"]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en el .env}
    ports:
      # En la VM, 80 y 443. Para probar en una PC donde están ocupados: HTTP_PORT y HTTPS_PORT en el .env
      # (p. ej. 8480 y 8443; se entra por https://localhost:8443). Ver docs/despliegue.md, «Probarlo en tu PC».
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    # postgres:17-alpine (pg_dump, pg_restore) + curl para copiar los respaldos a Azure
    build:
      context: ./deploy
      dockerfile: respaldo.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el .env}
      PGDATABASE: ${DB_NAME:-printflow}
      RETENCION_DIAS: ${RETENCION_DIAS:-30}
      AZURE_BLOB_SAS_URL: ${AZURE_BLOB_SAS_URL:-}
      TZ: America/Guayaquil
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/backup.sh"]

volumes:
  caddy_data:
  caddy_config:
