# PrintFlow · entorno completo en local con un solo comando:
#   docker compose up --build
#
# Requisitos:
#   - Este repo (SE2-4-Printflow) y el frontend (SE2-4-Printflow-Frontend) clonados lado a lado
#     en la misma carpeta. Si el frontend está en otro lugar, definir FRONTEND_PATH en el .env.
#   - Un .env en la raíz de este repo (copiar de .env.example y completar).
#
# Servicios:
#   web   -> http://localhost:8080   (WEB_PORT) proxy inverso (nginx) + SPA; reenvía /api y /socket.io a la API
#   api   -> solo dentro de la red de Docker (puerto 9000)
#   db    -> PostgreSQL 17; expuesto solo en 127.0.0.1:5433 (DB_HOST_PORT) para psql/pgAdmin
#   n8n   -> http://localhost:5678   (solo local); llama a la API en http://api:9000/api/ingesta/cargar

name: printflow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el .env}
      POSTGRES_DB: ${DB_NAME:-printflow}
      # Contraseña de los usuarios de prueba al crear la base (vacía = Printflow2026*, ver init.sh)
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      TZ: America/Guayaquil
    volumes:
      - db_data:/var/lib/postgresql/data
      # Migraciones y seeds del Equipo C. Al crear el volumen se aplican todas (init.sh); en una base
      # que ya existe, las nuevas se aplican con `npm run migrar` (db/migrar.sh).
      - ./db:/printflow-db:ro
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-printflow.sh:ro
    ports:
      # 5433 en tu PC para no chocar con un PostgreSQL instalado en Windows (cambiar con DB_HOST_PORT)
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      # Por TCP (-h 127.0.0.1): mientras init.sh crea la base, Postgres solo escucha en el socket, así
      # que la base no figura «healthy» (ni arranca la API, ni corre migrar.sh) hasta que termina.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_SSL: "false"
      PORT: 9000
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # S3-03: con CORREO_MODO=archivo, los avisos por correo quedan aquí como .eml
      - ./buzon-salida:/app/buzon-salida
    expose:
      - "9000"

  web:
    build:
      context: ${FRONTEND_PATH:-../SE2-4-Printflow-Frontend}
      args:
        # Vacío = misma URL que la página; nginx reenvía /api a la API.
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  n8n:
    # Actualizar la versión a la que use DOX en producción.
    image: n8nio/n8n:${N8N_VERSION:-1.64.0}
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: America/Guayaquil
      TZ: America/Guayaquil
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"

  # Servidor de correo de PRUEBAS (S3-03): atrapa los correos y los muestra en http://localhost:8025.
  # No envía nada a internet. Opcional: docker compose --profile correo up -d
  # y en el .env: CORREO_MODO=smtp, SMTP_HOST=mailpit, SMTP_PORT=1025
  mailpit:
    image: axllent/mailpit:v1.20
    profiles: ["correo"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"

  # Simulador del flujo de correo (hace lo que hacía el n8n de DOX, con datos ficticios).
  # No arranca con `up`: se usa bajo demanda. Ver simulador/README.md
  #   docker compose run --rm simulador demo.js
  simulador:
    image: node:22-slim
    profiles: ["simulador"]
    working_dir: /simulador
    entrypoint: ["node"]
    command: ["procesar-buzon.js"]
    environment:
      API_URL: http://api:9000
      INGESTA_TOKEN: ${INGESTA_TOKEN:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      TZ: America/Guayaquil
    volumes:
      - ./simulador:/simulador
    depends_on:
      - api

volumes:
  db_data:
  n8n_data:
